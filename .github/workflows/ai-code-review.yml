name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI review checklist
        run: |
          echo "Automated PR review started"
          echo "- Check for Next.js route and server component issues"
          echo "- Verify TypeScript typing and React hook correctness"
          echo "- Look for accessibility and performance regressions"
          echo "- Ensure secrets and environment variables are handled safely"
